<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>3D Explorer - Sections</title>
    <link rel="stylesheet" href="sections.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="footer.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="img/sysm_logo.png" alt="Sun Yat Sen">
            </div>
            <button id="menuButton">Menu</button>
        </nav>
    </header>

    <div id="menu" class="menu">
        <ul>
            <li><button onclick="location.href='index.html'">Home</button></li>
            <li><button onclick="location.href='history.html'">History</button></li>
            <li><button onclick="location.href='sections.html'">3D Museum Explorer</button></li>
            <li><button onclick="location.href='gallery.html'">Photo Gallery</button></li>
            <li><button onclick="location.href='about.html'">About Us</button></li>
        </ul>
    </div>

    <div class="translate">
        <h3>Language</h3>
        &nbsp;
        <div id="google_translate_element"></div> 
    </div>

    <center>
        <h1>Explore The Peranakan Heritage</h1>
        <table>
            <tr>
                <td class ="S1" colspan="2">
                    <button class="room-button" data-value="entrance">Entrance</button>
                </td>
                
            </tr>
            <tr>
                <td class ="S2" colspan="2">
                    <button class="room-button" data-value="drawing-room">Front Hall</button>
                </td>
            </tr>
            <tr>
                <td class ="S3" colspan="2">
                    <button class="room-button" data-value="meeting-hall">Second Hall</button>
                </td>
            </tr>
            <tr>
                <td class ="S4" colspan="2">
                    <button class="room-button" data-value="mid-section">Mid Section</button>
                </td>
            </tr>
            <tr>
                <td class ="S7" colspan="2">
                    <button class="room-button" data-value="kitchen">Kitchen (Back)</button>
                </td>
            </tr>

        </table>
    </center>

    <div class="combo-container">
        <div>
            <label for="roomSelect">Select Room:</label>
            <br>
            <select id="roomSelect">
                <option value="entrance">Entrance</option>
                <option value="drawing-room">Front Hall</option>
                <option value="meeting-hall">Second Hall</option>
                <option value="mid-section">Mid Section</option>
                <option value="kitchen">Kitchen</option>
                
            </select>
        </div>
        
        <div>
            <label for="objectSelect">Select Object:</label>
            <br>
            <select id="objectSelect"></select>
        </div>

        
    </div>

    <!-- Insert object section header here-->

    <div class="checkbox-container">
        <input type="checkbox" id="infoCheckbox">
        <label for="infoCheckbox">Object Info</label>
    </div>

    <div class="progress-bar-container">
        <label class="progress-label" for="progress-bar">Loading 3D Explorer</label>
        <br>
        <progress id="progress-bar" value="0" max="100"></progress>
        <br>
        <label class="progress-label">
            Loading too long?
            <br>
            Why not visit us!
        </label>
        <br>
        <button class="button" onclick="location.href='about.html'">Find Us Here!</button>
    </div>

    

    <!-- 3D container -->
    <div id="container3D" class="container3D"></div>

    <!-- Info container -->
    <div class="info-container">
        <div id="objectDescription" class="object-description">
            <!-- Object descriptions will be dynamically inserted here -->
        </div>
    </div>

    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <!-- Foooter -->
    <footer> 
        <div class="footer">
            <p>&copy; 2023 Sun Yat Sen Museum. All rights reserved.</p>
        </div> 
        
    </footer> 

<!-- ----------------------------SCRIPTS------------------------------- -->

    <!-- Three.js import map for 3D environment -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
            }
        }
      </script>

    <!-- GSAP library for camera movements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Script to load 3D -->
    <script src="3js3.js" type="module"></script>

    <!-- Script for menu bar functions -->
    <script src="menu.js" type="module"></script>

    <!-- Script to pick rooms and objects -->
    <script src="sections.js" type="module"></script>

    <!-- Google translate script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                {pageLanguage: 'en'},
                'google_translate_element'
            );
        } 
    </script>

<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>

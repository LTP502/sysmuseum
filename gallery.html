<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="lightbox.css">

    <style>
        .footer {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: #4b3e32;
            color: #f4f1e9;
            text-align: center;
            font-size: 14px;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="img/sysm_logo.png" alt="Sun Yat Sen">
            </div>
            <button id="menuButton">Menu</button>
        </nav>
    </header>

    <div id="menu" class="menu">
        <ul>
            <li><button onclick="location.href='index.html'">Home</button></li>
            <li><button onclick="location.href='history.html'">History</button></li>
            <li><button onclick="location.href='sections.html'">3D Museum Explorer</button></li>
            <li><button onclick="location.href='gallery.html'">Photo Gallery</button></li>
            <li><button onclick="location.href='about.html'">About Us</button></li>
        </ul>
    </div>

    <div class="translate">
        <h3>Language</h3>
        &nbsp;
        <div id="google_translate_element"></div> 
    </div>

    <div class="container">
        <h1 class="title">Photo Gallery</h1>

        <div class="gallery">

            <!-- Col 1 -->
            <div class="column">
                <div class="photo">
                    <a href="img/meeting_area_1.jpg" data-lightbox="museum" data-title="The meeting area. <br> Where Sun Yat Sen held his meeting when he was in Penang.">
                        <img src="img/meeting_area_1.jpg" alt="Image 1">
                    </a>
                </div>

                <div class="photo">
                    <a href="img/teaset.jpg" data-lightbox="museum" data-title="Antique Teaset. <br> Looks like an antique teaset for serving and pouring tea. Property of the previous house owners">
                        <img src="img/teaset.jpg" alt="Teaset">
                    </a>
                </div>

                <div class="photo">
                    <a href="img/courtyard_1.jpg" data-lightbox="museum" data-title="Courtyard. <br> The same courtyard with on open top that Dr. Sun enjoyed the view of. Now it is as beautiful as it ever was.">
                        <img src="img/courtyard_1.jpg" alt="">
                    </a>

                    
                </div>
            </div>
            
            <!-- Col 2 -->
            <div class="column">
                <div class="photo">
                    <a href="img/coffee_set.jpg" data-lightbox="museum" data-title="Coffe & Tea making set. <br> Local coffee (kopi) powder combines coffee beans, sesame beans, salt, sugar and margarine. Water is kept boiling in a locally-fabricated energy-efficient boiler, using a minimum amount of charcoal and a cement slab as a heating element. Property of the previous house owners.">
                        <img src="img/coffee_set.jpg" alt="">
                    </a>
                    
                </div>

                <div class="photo">
                    <a href="img/souvenir_stand.jpg" data-lightbox="museum" data-title="The Souvenir Stand. <br> Get your tote bags here!">
                        <img src="img/souvenir_stand.jpg" alt="">
                    </a>
                    
                </div>

                <div class="photo">
                    <a href="img/courtyard_4.jpg" data-lightbox="museum" data-title="Open top of the courtyard. <br> The rain pours in, wattering what is placed under it. Paired with a clever water drainage system, area's surrounding the open top does not get wet.">
                        <img src="img/courtyard_4.jpg" alt="">
                    </a>
                    
                </div>
            </div>

            <!-- Col 3 -->
            <div class="column">
                <div class="photo">
                    <a href="img/courtyard_5.jpg" data-lightbox="museum" data-title="Courtyard">
                        <img src="img/courtyard_5.jpg" alt="">
                    </a>
                    
                </div>

                <div class="photo">
                    <a href="img/kitchen_1.jpg" data-lightbox="museum" data-title="The kitchen. <br> Where the previous owner cooked.">
                        <img src="img/kitchen_1.jpg" alt="">
                    </a>
                    
                </div>

                <div class="photo">
                    <a href="img/pocket_watch.jpg" data-lightbox="museum" data-title="Dr. Sun's Pocket Watch. <br> An illustration of the original.">
                        <img src="img/pocket_watch.jpg" alt="">
                    </a>
                    
                </div>

                <div class="photo">
                    <a href="img/safe.jpg" data-lightbox="museum" data-title="The Safe. <br> Personal and confidential items used to be kept in it. Now it is but a huge heavy block of solid metal, displaying its sturdiness in the face of time and wear. Property of the previous house owner.">
                        <img src="img/safe.jpg" alt="">
                    </a>
                    
                </div>
            </div>

        </div>
    </div>
    

    <!-- Foooter -->
    <footer> 
        <div class="footer">
            <p>&copy; 2023 Sun Yat Sen Museum. All rights reserved.</p>
        </div> 
        
    </footer> 

    <!-- ----------------------------SCRIPTS------------------------------- -->

    <!-- Script to handle navbar menu -->
    <script src="menu.js" type="module"></script>

    <!-- Script to handle picture navigator -->
    <script src="lightbox-plus-jquery.min.js"></script>

    <!-- Google translate script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                {pageLanguage: 'en'},
                'google_translate_element'
            );
        } 
    </script>

<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
